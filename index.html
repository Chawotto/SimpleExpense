<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow Ultra</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div id="toast-container" aria-live="polite"></div>

    <section id="auth-section" class="screen active">
        <div class="auth-card glass">
            <div class="logo-box"><i class="fa-solid fa-wallet"></i></div>
            <h1>Finance<span class="gradient-text">Flow</span></h1>
            <p class="subtitle">Ваши финансы под контролем</p>
            <button id="login-btn" class="btn btn-google" aria-label="Войти через аккаунт Google">
                <i class="fa-brands fa-google"></i> Войти через Google
            </button>
        </div>
    </section>

    <section id="app-section" class="screen hidden">
        <div class="app-container">
            <header>
                <div class="profile">
                    <img id="user-avatar" src="" alt="Аватар пользователя">
                    <div class="profile-info">
                        <span class="greeting">Привет,</span>
                        <h3 id="user-name">User</h3>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="currency-wrapper">
                        <select id="currency-select" class="glass-select" aria-label="Выбор валюты">
                            <option value="RUB">RUB ₽</option>
                            <option value="BYN">BYN Br</option>
                            <option value="USD">USD $</option>
                            <option value="EUR">EUR €</option>
                        </select>
                    </div>
                    <!-- UX: добавлены aria-labels для скринридеров -->
                    <button id="theme-toggle" class="icon-btn" aria-label="Переключить тему"><i class="fa-solid fa-moon"></i></button>
                    <button id="logout-btn" class="icon-btn" aria-label="Выйти из аккаунта"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>

            <div class="balance-card glass">
                <div class="balance-header">
                    <span>Общий баланс</span>
                    <select id="filter-month" class="glass-select small" aria-label="Фильтр по времени">
                        <option value="current">Этот месяц</option>
                        <option value="all">За всё время</option>
                    </select>
                </div>
                <div class="total-balance"><span id="total-balance">0</span></div>
                <div class="stats-row">
                    <div class="stat-item income">
                        <div class="icon-circle up"><i class="fa-solid fa-arrow-trend-up"></i></div>
                        <div><span class="stat-label">Доход</span><span id="total-income" class="stat-value">0</span></div>
                    </div>
                    <div class="stat-item expense">
                        <div class="icon-circle down"><i class="fa-solid fa-arrow-trend-down"></i></div>
                        <div><span class="stat-label">Расход</span><span id="total-expense" class="stat-value">0</span></div>
                    </div>
                </div>
            </div>

            <!-- БЛОК: ФИНАНСОВЫЕ ЦЕЛИ -->
            <div class="goals-section glass">
                <div class="section-header">
                    <h3>Мои цели</h3>
                    <button id="add-goal-btn" class="mini-icon-btn" aria-label="Добавить новую цель"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="goals-container">
                    <!-- Цели рендерятся тут -->
                </div>
                <!-- UX: Empty State для целей -->
                <div id="goals-empty-state" class="empty-mini hidden">
                    <p>У вас пока нет финансовых целей. Нажмите "+", чтобы создать.</p>
                </div>
            </div>

            <div class="chart-wrapper glass">
                <canvas id="expensesChart" aria-label="График расходов по категориям"></canvas>
                <div class="chart-center-text"><span class="chart-label">Расходы</span></div>
            </div>

            <div class="action-area">
                <h3>Добавить операцию</h3>
                <div class="type-toggle">
                    <input type="radio" name="type" id="type-expense" value="expense" checked>
                    <label for="type-expense" class="toggle-btn expense" tabindex="0">Расход</label>
                    <input type="radio" name="type" id="type-income" value="income">
                    <label for="type-income" class="toggle-btn income" tabindex="0">Доход</label>
                </div>
                <form id="expense-form">
                    <div class="input-row">
                        <div class="input-wrap"><i class="fa-solid fa-pen-to-square"></i><input type="text" id="title-input" placeholder="Название" required aria-label="Название операции"></div>
                        <div class="input-wrap"><i class="fa-solid fa-coins"></i><input type="number" id="amount-input" placeholder="Сумма" required step="0.01" aria-label="Сумма операции"></div>
                    </div>
                    <div class="input-row">
                        <select id="category-input" class="styled-input" aria-label="Категория"></select>
                        <input type="date" id="date-input" class="styled-input" required aria-label="Дата операции">
                    </div>
                    <button type="submit" id="add-btn" class="btn btn-primary"><i class="fa-solid fa-check"></i> Сохранить</button>
                </form>
            </div>

            <div class="history-section">
                <h3>История</h3>
                <div id="loader" class="loader hidden"></div>
                <div id="transactions-container" aria-live="polite"></div>
                <div id="empty-state" class="hidden">
                    <div class="empty-icon"><i class="fa-solid fa-receipt"></i></div>
                    <p>Список операций пуст</p>
                </div>
            </div>
        </div>
    </section>

    <div id="goal-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal glass">
            <div class="modal-header"><h3>Новая цель</h3><button id="close-goal-modal" aria-label="Закрыть"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <input type="text" id="goal-title" class="styled-input" placeholder="На что копим?" aria-label="Название цели">
                <input type="number" id="goal-target" class="styled-input" placeholder="Сумма цели" aria-label="Сумма цели">
            </div>
            <div class="modal-footer"><button id="save-goal" class="btn btn-primary">Создать цель</button></div>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal glass">
            <div class="modal-header"><h3>Редактировать</h3><button id="close-modal" aria-label="Закрыть"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <input type="text" id="edit-title" class="styled-input" placeholder="Название" aria-label="Название операции">
                <input type="number" id="edit-amount" class="styled-input" placeholder="Сумма" step="0.01" aria-label="Сумма операции">
            </div>
            <div class="modal-footer"><button id="save-edit" class="btn btn-primary">Обновить</button></div>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal glass text-center">
            <div class="warning-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <h3 id="confirm-title">Удалить операцию?</h3>
            <p id="confirm-msg" style="color: var(--text-secondary); margin-bottom: 20px; font-size: 14px;">Это действие нельзя отменить.</p>
            <div class="modal-footer split">
                <button id="cancel-confirm" class="btn secondary-btn">Отмена</button>
                <button id="ok-confirm" class="btn btn-danger">Удалить</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
